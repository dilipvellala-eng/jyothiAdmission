services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  server:
    build: ./server
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/school_admissions
      JWT_SECRET: change-me-in-production
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost:5173
      UPLOAD_DIR: uploads
    depends_on:
      - mongo
    volumes:
      - server_uploads:/app/uploads

  client:
    build: ./client
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  mongo_data:
  server_uploads:
